# the one scheduled workflow: hourly the watchdog runs (watch provider pages
# and the openrouter api, append observed rows, open draft PRs), followed by a
# claude code review pass that judges up to the 10 oldest PRs awaiting review
# (the review queue, listed by the merge script), then a deterministic merge
# step that merges the PRs the pass marked `automerge: yes`; weekly (monday
# 05:17 utc) a live smoke probe checks the moonshot .md endpoints. push/PR
# gates stay in ci.yml + publish.yml. GH_TOKEN must be the cloudybot PAT with
# repo scope (repo secret): a GITHUB_TOKEN cannot answer `gh api user`, which
# the list and merge steps read whenever an open non-seed pricelog PR's branch
# still resolves, and the watchdog only on a runner with no git identity (through
# pr.ensure_author). the claude pass reads ANTHROPIC_API_KEY and
# ANTHROPIC_BASE_URL from repo secrets and the model from the repo variable
# ANTHROPIC_MODEL.
#
# trigger model: this workflow is dispatch-only. the PRIMARY hourly trigger is
# `gh workflow run autopr -f scheduled=true` fired by a systemd timer on the
# automation box, plus a monday 05:17 dispatch for the smoke probe — both
# because github's schedule delivery is delayed under load and marks that
# cannot be delivered inside their interval are dropped (measured ~28%
# delivery for hourly marks vs ~100% for daily marks on this repo, same
# account). autopr-fallback.yml carries the six-marks-an-hour github cron and
# dispatches here only when no run started in the last hour, so the pipeline
# keeps ticking when the box is down.

name: autopr

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: set by the box dispatcher and the cron fallback; manual dispatches leave it unset
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# a duplicate dispatch is priced as a no-op (the pending scan finds every
# model covered), which only holds when it never overlaps the run it
# duplicates: concurrent runs race the scan and both open PRs for the same
# models (observed 2026-09-22: a late fallback mark fired 14s before the box
# timer; the pair opened duplicate PRs and one merge step died on the
# other's unfetched branch ref). the group serializes them; the queued run
# then opens nothing and stays green
concurrency:
  group: autopr
  cancel-in-progress: false

# an unfrozen `uv run` re-resolves the committed lock here, because the lock
# records the resolver settings that wrote it and this runner carries none of
# them. the rewritten uv.lock leaves the checkout dirty, which the merge step
# reads as a tree it must not touch
env:
  UV_FROZEN: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run watchdog
        run: set -o pipefail; uv run ai-pricelog 2>&1 | tee /tmp/run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: list PRs awaiting review
        id: queue
        # NOT continue-on-error: a failed listing reds the run, never a green
        # run whose pass skipped an unknown queue. stdout is the machine list
        # the prompt pastes in; the cat makes it visible in the run log. the
        # queue is decoupled from this run's own output, so it lists even
        # when the watchdog step failed
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          uv run ai-pricelog-merge-verified --awaiting-review 10 > /tmp/review-queue.txt
          cat /tmp/review-queue.txt
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: claude review pass
        continue-on-error: true
        if: ${{ !cancelled() }}
        # the pass itself gets 50 min: a pass that finished its work but hung
        # (observed 2026-09-09: merged everything by min 45, then sat idle
        # until the job cap cancelled it) must die early enough that the
        # tripwire below still runs. with the list and merge steps at their
        # 10-min caps too, the capped steps take up to 70 of the job's 80 min,
        # leaving ~10 for setup, the watchdog and the health step (measured
        # 2026-10-14: over the last 40 runs the longest job took 553 s, the
        # median 205 s)
        timeout-minutes: 50
        run: |
          # pipefail so pass_rc below is claude's status, never tee's
          set -o pipefail
          # a failed listing leaves the queue file as empty as an empty queue
          # does, so the list step's own outcome tells the two apart
          [ "$QUEUE_OUTCOME" = success ] || [ -s /tmp/review-queue.txt ] || { echo "listing the PRs awaiting review failed, so the review queue is unknown; skipping the claude pass"; exit 0; }
          [ -s /tmp/review-queue.txt ] || { echo "no PR awaits review; skipping the claude pass"; exit 0; }
          [ -n "$CLAUDE_MODEL" ] || { echo "::error::the ANTHROPIC_MODEL repo variable is unset; the pass refuses to fall back to the CLI default model"; exit 1; }
          npm install -g @anthropic-ai/claude-code@2 >/dev/null
          {
            cat .github/claude-pass/prompt.md
            echo
            echo "## PRs awaiting review"
            cat /tmp/review-queue.txt
            echo
            echo "## this run's pipeline log"
            cat /tmp/run.log
          } > /tmp/prompt.md
          export ANTHROPIC_API_KEY
          export ANTHROPIC_MODEL="$CLAUDE_MODEL"
          [ -n "$CLAUDE_BASE_URL" ] && export ANTHROPIC_BASE_URL="$CLAUDE_BASE_URL"
          # stream-json emits one event per line (tee flushes per line), so
          # a killed pass still trails how far it got and the tripwire runs
          # on the events it emitted; plain -p buffers everything until the
          # end and a killed pass left zero output
          set +e
          # the runner's step kill lands on the entry process alone
          # (actions/runner ProcessInvoker.cs, NixKillProcessTree), so a hung
          # CLI whose subprocesses survive it outlives the step cap; the inner
          # timeout signals the whole group (TERM, KILL after 15 s) and, orphaned
          # by the runner's ladder, still fires past it
          # curl/jq/uv: source checks need full bodies — a WebFetch of the
          # ~750KB openrouter api is a model extraction that silently omits
          # records, and the pass's denied curl fallbacks left it nothing
          # else (observed 2026-09-22: false absence verdicts on PRs 333/337)
          timeout -k 15 50m claude -p --output-format stream-json --verbose --allowedTools "Read" "Edit" "Bash(gh:*)" "Bash(git:*)" "Bash(curl:*)" "Bash(jq:*)" "Bash(uv:*)" "WebFetch" "WebSearch" < /tmp/prompt.md 2>&1 | tee /tmp/pass.log
          pass_rc=$?
          echo "$pass_rc" > /tmp/pass.rc
          set -e
          # grep, never rg: the github runner image ships no rg (observed
          # 2026-09-09: the check died "command not found" inside the if,
          # the 127 read as a clean exit, and every pass failure shipped
          # silently for 7 runs). unrecognized_model telemetry fires on
          # every healthy run too (a base-url model outside the client
          # catalog), so it is NOT a failure signature on its own
          if grep -Eq "401 Authentication Fails|No available channel|API Error" /tmp/pass.log; then
            echo "::warning::the claude pass failed to authenticate; the queued PRs went unjudged. rotate ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL and fix the ANTHROPIC_MODEL repo variable."
          fi
          # a cancelled or crashed pass leaves the queue unjudged: the step
          # is continue-on-error, so the job reads green either way — the
          # fail-on-a-dead-review-pass step below reds it
          if [ "$pass_rc" -ne 0 ]; then
            echo "::warning::the claude pass exited $pass_rc; the queued PRs stay queued for the next pass. read the pass log in this run."
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          # GH_TOKEN holds the cloudybot PAT: every automation action (open
          # pr, comment, merge commit) acts as the bot, so a @-mention in a
          # needs-human comment notifies the owner (a self-mention never does)
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: merge verified PRs
        # NOT continue-on-error: a deterministic merge failure must red the
        # run; the PRs stay open and a human looks. a silent green merge
        # failure is the bug class this step exists to close. if: always()
        # because the pass step is continue-on-error: the dispositions are
        # already posted when the pass dies, and the merge must still run.
        # the script reads every open pricelog PR's marker, so a yes-marked
        # PR a failed merge step stranded merges on a later run's merge
        # step, and prints nothing to merge when no open PR is marked. the
        # pass leaves the checkout wherever it last worked (observed
        # 2026-09-20: two runs red'd when the merge's own guard refused the
        # pass's review branch), so the step fetches and re-establishes the
        # base at its fresh remote tip before the script's guard reads it —
        # the job's checkout-time refs are minutes old, and a base that
        # moved mid-run reds by name instead of rejecting at the push
        # (observed 2026-09-18). -f discards the pass's leftover edits,
        # which are already pushed
        if: always()
        timeout-minutes: 10
        run: |
          git fetch origin
          git checkout -f -B mommy origin/mommy
          # the rc marker mirrors the pass step's: the health step's deduped
          # `merge step failed` ping reads it, and a step killed before it
          # writes (the timeout) reads as dead there, never as clean
          set +e
          uv run ai-pricelog-merge-verified
          merge_rc=$?
          echo "$merge_rc" > /tmp/merge.rc
          exit "$merge_rc"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: fail on a dead review pass
        # a pass that dies leaves the PRs it never judged unjudged: red,
        # never a green with warnings (the class this step exists to close;
        # measured 2026-09-18: 5 days of green runs piled up 33 unreviewed
        # PRs). the merge step above already ran, so redding here can never
        # orphan a merge. a killed pass never writes /tmp/pass.rc, which
        # reads as dead here and in the health step. due only when the
        # queue was non-empty
        if: always()
        run: |
          [ -s /tmp/review-queue.txt ] || exit 0
          if [ ! -f /tmp/pass.rc ] || [ "$(cat /tmp/pass.rc)" != "0" ]; then
            echo "::error::the claude pass died with PRs awaiting review; the queued PRs stay queued for the next pass. read the pass log in this run."
            exit 1
          fi

      - name: provider health check
        if: always()
        run: |
          args=(/tmp/run.log)
          if [ -s /tmp/review-queue.txt ]; then
            if [ ! -f /tmp/pass.rc ] || [ "$(cat /tmp/pass.rc)" != "0" ]; then
              args+=(--pass-dead)
            else
              args+=(--pass-alive)
            fi
          fi
          if [ ! -f /tmp/merge.rc ] || [ "$(cat /tmp/merge.rc)" != "0" ]; then
            args+=(--merge-dead)
          else
            args+=(--merge-alive)
          fi
          uv run ai-pricelog-health "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the box dispatches the weekly probe without the input (a manual-shaped
    # dispatch, same as a human's); the hourly timer and the cron fallback set
    # scheduled=true, and an hourly moonshot probe is not wanted. the gate
    # reads the event payload as a string: the inputs context holds a real
    # boolean for a type: boolean input, and a mixed-type comparison coerces
    # both sides to numbers (boolean true -> 1, a string that is no number ->
    # NaN), so `inputs.scheduled != 'true'` is `1 != NaN` and never skips
    # (measured 2026-09-20: every hourly run since the 2026-09-15 refactor
    # executed the smoke job)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scheduled != 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run moonshot smoke probe
        run: uv run ai-pricelog-smoke
