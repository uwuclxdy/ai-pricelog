# one section per watched provider. provider = the human-facing name in pr
# titles and bodies, detector/scraper = module names under
# ai_pricelog.{detectors,scrapers}. sources pinned 2026-08-19.

[settings]
cap = 3

[deepseek]
provider = "DeepSeek"
detector = "deepseek_page"
detector_url = "https://api-docs.deepseek.com/quick_start/pricing"
scraper = "deepseek_page"
scraper_url = "https://api-docs.deepseek.com/quick_start/pricing"

