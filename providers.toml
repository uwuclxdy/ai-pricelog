# one section per watched provider. provider = the human-facing name in pr
# titles and bodies, detector/scraper = module names under
# ai_pricelog.{detectors,scrapers}. sources pinned 2026-08-19.
# announce_urls = public news/changelog/rss channels watched each run for
# billing-rule announcements (rate, tier, when-rates-apply, free-tier
# changes); the key is optional and absent for providers with no watchable
# surface. status feeds stay out (incidents only). channel choice evidence:
# docs/research/announce-channels/.

[settings]
cap = 10

[deepseek]
provider = "DeepSeek"
detector = "deepseek_page"
detector_url = "https://api-docs.deepseek.com/quick_start/pricing/"
scraper = "deepseek_page"
scraper_url = "https://api-docs.deepseek.com/quick_start/pricing/"
announce_urls = [
  "https://api-docs.deepseek.com/updates/",
  "https://api-docs.deepseek.com/sitemap.xml",
]

[zai]
provider = "Z.AI"
detector = "zai_page"
detector_url = "https://docs.z.ai/guides/overview/pricing"
scraper = "zai_page"
scraper_url = "https://docs.z.ai/guides/overview/pricing"
announce_urls = [
  "https://docs.z.ai/release-notes/new-released.md",
  "https://docs.z.ai/devpack/notice/usage-revision.md",
  "https://docs.z.ai/devpack/transition.md",
  "https://docs.z.ai/llms.txt",
]

