[project]
name            = "autopr-genai-prices"
version         = "0.1.0"
description     = "watch model releases, open draft PRs to a genai-prices-layout repo"
requires-python = ">=3.12"
license         = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.15.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0",
]

[project.scripts]
autopr-genai-prices = "autopr_genai_prices.pipeline:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopr_genai_prices"]

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = ["-n", "auto", "--dist", "loadscope"]
timeout      = 120
timeout_method = "thread"
