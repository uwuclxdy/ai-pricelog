# the one scheduled workflow: every 2h the watchdog runs (watch provider pages
# and the openrouter api, append observed rows, open draft PRs), followed by a
# claude code review pass when the run changed something, then a deterministic
# merge step that merges the PRs the pass marked `automerge: yes`; weekly
# (monday 05:17 utc) a live smoke probe checks the moonshot .md endpoints.
# push/PR gates stay in ci.yml + publish.yml. GH_TOKEN = the cloudybot PAT
# with repo scope (repo secret); falls back to GITHUB_TOKEN. the claude pass
# reads ANTHROPIC_API_KEY and optional ANTHROPIC_BASE_URL / ANTHROPIC_MODEL
# overrides from repo secrets.

name: autopr

on:
  schedule:
    - cron: "0 */2 * * *" # every 2h
    - cron: "17 5 * * 1" # weekly monday 05:17 utc
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# an unfrozen `uv run` re-resolves the committed lock here, because the lock
# records the resolver settings that wrote it and this runner carries none of
# them. the rewritten uv.lock leaves the checkout dirty, which the merge step
# reads as a tree it must not touch
env:
  UV_FROZEN: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run watchdog
        run: set -o pipefail; uv run ai-pricelog 2>&1 | tee /tmp/run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: claude review pass
        continue-on-error: true
        # the pass itself gets 30 min: the whole job is capped at 60, and a
        # pass that finished its work but hung (observed 2026-09-09: merged
        # everything by min 45, then sat idle until the job cap cancelled it)
        # must die early enough that the tripwire below still runs
        timeout-minutes: 30
        run: |
          [ -f .run-changed ] || { echo "run changed nothing; skipping the claude pass"; exit 0; }
          npm install -g @anthropic-ai/claude-code@2 >/dev/null
          {
            cat .github/claude-pass/prompt.md
            echo
            echo "## this run's pipeline log"
            cat /tmp/run.log
          } > /tmp/prompt.md
          export ANTHROPIC_API_KEY
          [ -n "$CLAUDE_BASE_URL" ] && export ANTHROPIC_BASE_URL="$CLAUDE_BASE_URL"
          [ -n "$CLAUDE_MODEL" ] && export ANTHROPIC_MODEL="$CLAUDE_MODEL"
          # claude -p under a step timeout leaves pass.log complete (tee
          # flushes per line), so the tripwire runs even on a killed pass
          set +e
          claude -p --allowedTools "Read" "Edit" "Bash(gh:*)" "Bash(git:*)" "WebFetch" "WebSearch" < /tmp/prompt.md 2>&1 | tee /tmp/pass.log
          pass_rc=$?
          set -e
          # grep, never rg: the github runner image ships no rg (observed
          # 2026-09-09: the check died "command not found" inside the if,
          # the 127 read as a clean exit, and every pass failure shipped
          # silently for 7 runs). unrecognized_model telemetry fires on
          # every healthy run too (a base-url model outside the client
          # catalog), so it is NOT a failure signature on its own
          if grep -Eq "401 Authentication Fails|No available channel|API Error" /tmp/pass.log; then
            echo "::warning::the claude pass failed to authenticate; rows shipped unverified. rotate ANTHROPIC_API_KEY and fix or clear ANTHROPIC_MODEL."
          fi
          # a cancelled or crashed pass is also silent shipping: the step
          # is continue-on-error, so the job reads green either way
          if [ "$pass_rc" -ne 0 ]; then
            echo "::warning::the claude pass exited $pass_rc; rows shipped unverified. read the pass log in this run."
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # GH_TOKEN holds the cloudybot PAT: every automation action (open
          # pr, comment, merge commit) acts as the bot, so a @-mention in a
          # needs-human comment notifies the owner (a self-mention never does)
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: merge verified PRs
        # NOT continue-on-error: a deterministic merge failure must red the
        # run; the PRs stay open and a human looks. a silent green merge
        # failure is the bug class this step exists to close. if: always()
        # because the pass step is continue-on-error: the dispositions are
        # already posted when the pass dies, and the merge must still run
        if: always()
        timeout-minutes: 10
        run: |
          [ -f .run-changed ] || { echo "run changed nothing; no merge"; exit 0; }
          uv run ai-pricelog-merge-verified /tmp/run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: provider health check
        if: always()
        run: uv run ai-pricelog-health /tmp/run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '17 5 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run moonshot smoke probe
        run: uv run ai-pricelog-smoke
