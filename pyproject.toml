[project]
name            = "litellm-autopr"
version         = "0.1.0"
description     = "watch model releases, open draft PRs to LiteLLM's model-prices file"
requires-python = ">=3.12"
license         = { text = "MIT" }
dependencies = [
  # add runtime deps with `uv add <pkg>`
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_autopr"]

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
