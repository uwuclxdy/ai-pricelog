# post-merge reindex: regenerate data/index.json from data/history.ndjson and
# push a correcting commit when it drifts. the push authenticates with
# checkout's persisted GITHUB_TOKEN: pushes made with GITHUB_TOKEN create no
# new workflow runs, so the correcting commit cannot retrigger this workflow
# (a PAT push like autopr's GH_TOKEN would).

name: reindex

on:
  push:
    branches: [mommy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reindex
  # newest run wins: its checkout has the newest history, an older run would push from a stale one
  cancel-in-progress: true

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: regenerate index.json from history.ndjson
        run: uv run python -c "from pathlib import Path; from ai_pricelog.store import load, write_index; write_index(load(Path('data/history.ndjson')), Path('data/index.json'))"

      - name: commit and push when drifted
        run: |
          if git diff --quiet -- data/index.json; then
            echo "index.json is in sync, nothing to push"
            exit 0
          fi
          echo "index.json drifted; committing the regen"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "chore(data): regenerate index.json"
          git push
