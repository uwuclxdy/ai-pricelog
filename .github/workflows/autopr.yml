# watchdog run: watch provider pages and the openrouter api, append observed
# price rows to data/history.ndjson, open one draft pr per change in this
# repo. GH_TOKEN = PAT with repo scope (repo secret); falls back to
# GITHUB_TOKEN.

name: autopr

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 utc
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run watchdog
        run: uv run ai-pricelog
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
