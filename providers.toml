scraper_url = "https://platform.minimax.io/docs/guides/pricing-paygo.md"
announce_urls = [
  "https://platform.minimax.io/docs/release-notes/models",
  "https://www.minimax.io/blog",
]

[xai]
provider = "xAI"
detector = "xai_page"
detector_url = "https://docs.x.ai/docs/models"
