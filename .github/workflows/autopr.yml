# the one scheduled workflow: hourly the watchdog runs (watch provider pages
# and the openrouter api, append observed rows, open draft PRs), followed by a
# claude code review pass when the run changed something, then a deterministic
# merge step that merges the PRs the pass marked `automerge: yes`; weekly
# (monday 05:17 utc) a live smoke probe checks the moonshot .md endpoints.
# push/PR gates stay in ci.yml + publish.yml. GH_TOKEN = the cloudybot PAT
# with repo scope (repo secret); falls back to GITHUB_TOKEN. the claude pass
# reads ANTHROPIC_API_KEY and optional ANTHROPIC_BASE_URL / ANTHROPIC_MODEL
# overrides from repo secrets.
#
# trigger model: this workflow is dispatch-only. the PRIMARY hourly trigger is
# `gh workflow run autopr -f scheduled=true` fired by a systemd timer on the
# automation box, plus a monday 05:17 dispatch for the smoke probe — both
# because github's schedule delivery is delayed under load and marks that
# cannot be delivered inside their interval are dropped (measured ~28%
# delivery for hourly marks vs ~100% for daily marks on this repo, same
# account). autopr-fallback.yml carries the six-marks-an-hour github cron and
# dispatches here only when no run started in the last hour, so the pipeline
# keeps ticking when the box is down.

name: autopr

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: set by the box dispatcher and the cron fallback; manual dispatches leave it unset
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# an unfrozen `uv run` re-resolves the committed lock here, because the lock
# records the resolver settings that wrote it and this runner carries none of
# them. the rewritten uv.lock leaves the checkout dirty, which the merge step
# reads as a tree it must not touch
env:
  UV_FROZEN: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run watchdog
        run: set -o pipefail; uv run ai-pricelog 2>&1 | tee /tmp/run.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: claude review pass
        continue-on-error: true
        # the pass itself gets 50 min: the whole job is capped at 80, and a
        # pass that finished its work but hung (observed 2026-09-09: merged
        # everything by min 45, then sat idle until the job cap cancelled it)
        # must die early enough that the tripwire below still runs
        timeout-minutes: 50
        run: |
          [ -f .run-changed ] || { echo "run changed nothing; skipping the claude pass"; exit 0; }
          npm install -g @anthropic-ai/claude-code@2 >/dev/null
          {
            cat .github/claude-pass/prompt.md
            echo
            echo "## this run's pipeline log"
            cat /tmp/run.log
          } > /tmp/prompt.md
          export ANTHROPIC_API_KEY
          [ -n "$CLAUDE_BASE_URL" ] && export ANTHROPIC_BASE_URL="$CLAUDE_BASE_URL"
          [ -n "$CLAUDE_MODEL" ] && export ANTHROPIC_MODEL="$CLAUDE_MODEL"
          # stream-json emits one event per line (tee flushes per line), so
          # a killed pass still trails how far it got and the tripwire runs
          # on the events it emitted; plain -p buffers everything until the
          # end and a killed pass left zero output
          set +e
          claude -p --output-format stream-json --verbose --allowedTools "Read" "Edit" "Bash(gh:*)" "Bash(git:*)" "WebFetch" "WebSearch" < /tmp/prompt.md 2>&1 | tee /tmp/pass.log
          pass_rc=$?
          echo "$pass_rc" > /tmp/pass.rc
          set -e
          # grep, never rg: the github runner image ships no rg (observed
          # 2026-09-09: the check died "command not found" inside the if,
          # the 127 read as a clean exit, and every pass failure shipped
          # silently for 7 runs). unrecognized_model telemetry fires on
          # every healthy run too (a base-url model outside the client
          # catalog), so it is NOT a failure signature on its own
          if grep -Eq "401 Authentication Fails|No available channel|API Error" /tmp/pass.log; then
            echo "::warning::the claude pass failed to authenticate; rows shipped unverified. rotate ANTHROPIC_API_KEY and fix or clear ANTHROPIC_BASE_URL / ANTHROPIC_MODEL."
          fi
          # a cancelled or crashed pass is also silent shipping: the step
          # is continue-on-error, so the job reads green either way — the
          # fail-on-a-dead-review-pass step below reds it
          if [ "$pass_rc" -ne 0 ]; then
            echo "::warning::the claude pass exited $pass_rc; rows shipped unverified. read the pass log in this run."
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # GH_TOKEN holds the cloudybot PAT: every automation action (open
          # pr, comment, merge commit) acts as the bot, so a @-mention in a
          # needs-human comment notifies the owner (a self-mention never does)
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: merge verified PRs
        # NOT continue-on-error: a deterministic merge failure must red the
        # run; the PRs stay open and a human looks. a silent green merge
        # failure is the bug class this step exists to close. if: always()
        # because the pass step is continue-on-error: the dispositions are
        # already posted when the pass dies, and the merge must still run.
        # the script reads every open pricelog PR's marker, so a yes-marked
        # PR a failed merge step stranded merges on a later data-changing
        # run's merge step
        if: always()
        timeout-minutes: 10
        run: |
          [ -f .run-changed ] || { echo "run changed nothing; no merge"; exit 0; }
          uv run ai-pricelog-merge-verified
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: fail on a dead review pass
        # a pass that dies on a data-changing run ships rows unverified and
        # leaves the merge without dispositions: red, never a green with
        # warnings (the class this step exists to close; measured
        # 2026-09-18: 5 days of green runs piled up 33 unreviewed PRs). the
        # merge step above already ran, so redding here can never orphan a
        # merge. a killed pass never writes /tmp/pass.rc, which reads as
        # dead here and in the health step.
        if: always()
        run: |
          [ -f .run-changed ] || exit 0
          if [ ! -f /tmp/pass.rc ] || [ "$(cat /tmp/pass.rc)" != "0" ]; then
            echo "::error::the claude pass died on a run that changed data; rows shipped unverified. read the pass log in this run."
            exit 1
          fi

      - name: provider health check
        if: always()
        run: |
          args=(/tmp/run.log)
          if [ -f .run-changed ]; then
            if [ ! -f /tmp/pass.rc ] || [ "$(cat /tmp/pass.rc)" != "0" ]; then
              args+=(--pass-dead)
            else
              args+=(--pass-alive)
            fi
          fi
          uv run ai-pricelog-health "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the box dispatches the weekly probe without the input (a manual-shaped
    # dispatch, same as a human's); the hourly timer and the cron fallback set
    # scheduled=true, and an hourly moonshot probe is not wanted. the gate
    # reads the event payload: the inputs-context form (inputs.scheduled !=
    # 'true') ran smoke on flagged dispatches anyway (measured 2026-09-20:
    # every hourly run since the 2026-09-15 refactor executed the smoke job),
    # so it cannot be trusted at job level
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scheduled != 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: run moonshot smoke probe
        run: uv run ai-pricelog-smoke
