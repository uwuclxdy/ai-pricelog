# yaml-language-server: $schema=.schema.json
name: MiniMax
id: minimax
pricing_urls:
  - https://platform.minimax.io/docs/guides/pricing-paygo
api_pattern: 'https://api\.minimax(i)?\.(?:com|io)'
price_comments: >-
  Prices sourced from MiniMax international platform USD pricing
  (platform.minimax.io, May 2026). M2.1, M2.1-highspeed, and M2 are legacy
  models; prices inferred from CNY pricing at the equivalent 7.00 CNY/USD
  rate used by the international platform for current models.
model_match:
  or:
    - starts_with: "MiniMax-M"
    - starts_with: "minimax-m"
    - equals: "minimax-01"
    - equals: "M2-her"
    - equals: "m2-her"
extractors:
  # Anthropic-compatible endpoint (api.minimax.io/anthropic/v1/messages): Anthropic
  # accounting — input_tokens excludes cache, so add cache back to get total input.
  - root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: cache_creation_input_tokens
        dest: input_tokens
        required: false
      - path: cache_read_input_tokens
        dest: input_tokens
        required: false
      - path: cache_creation_input_tokens
        dest: cache_write_tokens
        required: false
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
  # OpenAI Responses-compatible endpoint (api.minimax.io/v1/responses): OpenAI
  # accounting — input_tokens already includes cached tokens (a subset).
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: MiniMax-M2.1-highspeed
    name: MiniMax M2.1 Highspeed
    description: >-
      MiniMax M2.1 highspeed variant (legacy) with higher throughput.
    match:
      or:
        - contains: "M2.1-highspeed"
        - contains: "m2.1-highspeed"
    context_window: 204800
    prices_checked: "2026-05-23"
    prices:
      input_mtok: 0.60
      cache_read_mtok: 0.03
      cache_write_mtok: 0.375
      output_mtok: 2.40

  - id: MiniMax-M2.7
    name: MiniMax M2.7
    description: >-
      MiniMax M2.7, a multimodal language model with 204,800 token context
      window. Achieves top performance in real-world engineering, office
      productivity, and character-rich interaction.
    match:
      or:
        - equals: MiniMax-M2.7
        - equals: minimax-m2.7
    context_window: 204800
    prices_checked: "2026-05-23"
    prices:
      input_mtok: 0.30
      cache_read_mtok: 0.06
      cache_write_mtok: 0.375
      output_mtok: 1.20

  - id: minimax-m3
    name: MiniMax M3
    description: >-
      MiniMax-M3 is a multimodal foundation model from MiniMax. It supports text, image, and video inputs with text output,
      a 1M-token context window, and long-horizon agentic work.
    match:
      equals: minimax-m3
    context_window: 1000000
    prices_checked: 2026-07-01
    price_comments: >-
      Prices from MiniMax pay-as-you-go page (https://platform.minimax.io/docs/guides/pricing-paygo,
      2026-07-01), standard service tier "Permanent 50% off" effective rate. Inputs over 512K tokens
      bill at 2x per MiniMax's length-based tiering.
    prices:
      input_mtok:
        base: 0.3
        tiers:
          - start: 512000
            price: 0.6
      cache_read_mtok:
        base: 0.06
        tiers:
          - start: 512000
            price: 0.12
      output_mtok:
        base: 1.2
        tiers:
          - start: 512000
            price: 2.4
